spring:
  application:
    name: pipeline-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pipeline}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

# Clerk JWT configuration
clerk:
  jwks-uri: ${CLERK_JWKS_URI:https://clerk.pipeline.example.com/.well-known/jwks.json}
  issuer: ${CLERK_ISSUER:https://clerk.pipeline.example.com}

# CORS configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://pipeline.vercel.app}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# Server configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: on_param

# Logging
logging:
  level:
    io.pipeline: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
