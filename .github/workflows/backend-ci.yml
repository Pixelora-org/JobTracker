name: Backend CI

on:
  pull_request:
    branches: [production, pre-production]
    paths: ['backend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and verify
        run: mvn -B clean verify

      - name: Build Docker image (smoke test)
        run: |
          cd ..
          docker build -t pipeline-backend:test backend/
        if: success()
